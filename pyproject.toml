[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aiida-workgraph-wishlist"
version = "0.0.0"
description = "Executable MWEs of aiida-workgraph behaviours we have and wish we had."
requires-python = ">=3.10"
# Track aiida-workgraph from GitHub main (not the PyPI release) so merged fixes
# land here as soon as they hit main, and aiida-core from its GitHub tag. uv.lock
# pins the exact commits; refresh with
#   uv lock --upgrade-package aiida-core --upgrade-package aiida-workgraph
dependencies = [
    "aiida-workgraph @ git+https://github.com/aiidateam/aiida-workgraph.git@main",
    # v2.9.1 is the last aiida-core that still depends on plumpy; main has absorbed
    # it, and aiida-workgraph main still imports plumpy without declaring it.
    "aiida-core @ git+https://github.com/aiidateam/aiida-core.git@v2.9.1",
    "pytest",
]

[tool.setuptools]
# No package to install; this repo is just an executable test suite.
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# Surface xfail/xpass prominently: -rX lists still-open wishes, xpass (a granted
# wish) is a failure under strict markers.
addopts = "-ra"
xfail_strict = true
